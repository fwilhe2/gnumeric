name: CI
on:
  push:
  workflow_dispatch:

env:
  # Everything (goffice + gnumeric) is installed into this prefix so the
  # uploaded artifact is self-contained.
  PREFIX: ${{ github.workspace }}/mybuild
  PKG_CONFIG_PATH: ${{ github.workspace }}/mybuild/lib/pkgconfig

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Enable deb-src repositories
      run: |
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        else
          sudo sed -i 's/^# *deb-src/deb-src/' /etc/apt/sources.list
        fi
        sudo apt-get update -y

    - name: Install build dependencies
      run: |
        sudo apt-get -y build-dep goffice gnumeric
        sudo apt-get -y install gtk-doc-tools yelp yelp-tools

    # Ubuntu ships at most goffice 0.10.57 (24.04 has 0.10.56), but gnumeric
    # master requires >= 0.10.61, so the distro package cannot be used.
    - name: Build goffice from source
      run: |
        git clone --depth 1 https://gitlab.gnome.org/GNOME/goffice.git /tmp/goffice
        cd /tmp/goffice
        NOCONFIGURE=1 ./autogen.sh
        ./configure --prefix="$PREFIX"
        make -j"$(nproc)"
        make install

    - name: Autogen
      run: NOCONFIGURE=1 ./autogen.sh

    - name: Configure
      run: ./configure --prefix="$PREFIX"

    - name: Make
      run: make -j"$(nproc)"

    - name: Make install to a local directory
      run: make install

    - name: Add launcher script
      run: |
        echo 'LD_LIBRARY_PATH=$PWD/lib ./bin/gnumeric' > "$PREFIX/run.sh"
        chmod +x "$PREFIX/run.sh"

    - name: Tar files to preserve file permissions
      run: tar -cf my-gnumeric-build.tar -C "$GITHUB_WORKSPACE" mybuild

    - name: Upload built Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: my-gnumeric-build
        path: my-gnumeric-build.tar
